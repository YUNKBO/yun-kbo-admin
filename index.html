<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YUN KBO | KOREAN SPORTS COLLECTION</title><style>:root{--navy:#0B0A2A;--orange:#DD6C32;--muted:#73768a}*{box-sizing:border-box}body{margin:0;font-family:'Microsoft JhengHei',Arial,sans-serif;color:var(--navy);background:#f7f8fb}header{background:white;border-bottom:1px solid #e8e8ee;padding:18px max(20px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:29px;font-weight:900;letter-spacing:1px;color:var(--orange)}.sub{font-size:10px;letter-spacing:2.5px;color:#777;margin-top:2px}nav{display:flex;gap:20px;align-items:center}nav a{color:var(--navy);text-decoration:none;font-weight:bold;font-size:14px}.shell{max-width:1240px;margin:auto;padding:22px}.hero{background:var(--navy);border-radius:18px;color:white;padding:34px 44px;display:flex;align-items:center;justify-content:space-between;min-height:165px}.hero h1{font-size:25px;line-height:1.65;margin:0}.hero .stamp{border:2px solid #fff8;border-radius:50%;width:130px;height:90px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px;transform:rotate(-8deg)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 28px}.step{background:white;border:1px solid #ededf2;border-radius:14px;padding:18px;min-height:106px}.step strong{font-size:15px}.step p{font-size:12px;color:#666b7b;line-height:1.8;margin:9px 0 0}.catalog{display:grid;grid-template-columns:205px 1fr;gap:24px}.filters,.content{background:white;border-radius:14px;border:1px solid #ededf2;padding:18px}.filters h3{font-size:14px;margin:4px 0 10px}.filters select,.search{width:100%;border:1px solid #dddfe8;border-radius:8px;padding:11px;background:white;color:var(--navy);margin-bottom:17px}.filters button{display:block;border:0;background:none;padding:9px 0;color:#565c6b;text-align:left;cursor:pointer}.filters button.active{color:var(--orange);font-weight:bold}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.top h2{font-size:19px;margin:0}.search{max-width:320px;margin:0}.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.product{border:1px solid #ebedf1;border-radius:12px;overflow:hidden}.photo{height:180px;background:linear-gradient(140deg,#e9ebf2,#f7f7f9);display:flex;align-items:center;justify-content:center;position:relative}.photo svg{width:95px;height:95px;opacity:.8}.tag{position:absolute;top:10px;left:10px;background:var(--orange);color:white;border-radius:4px;padding:4px 7px;font-size:10px}.info{padding:12px}.info h3{font-size:13px;min-height:38px;margin:0 0 8px}.price{font-weight:bold;font-size:17px}.add{background:var(--orange);color:white;border:0;width:100%;padding:10px;border-radius:8px;margin-top:11px;cursor:pointer}.hint{font-size:12px;color:#777;margin-top:20px}.notice{font-size:12px;color:#777;background:#fff4e9;padding:10px 15px;border-radius:8px;margin-bottom:15px}.cart{background:var(--navy);color:white;border:0;padding:11px 14px;border-radius:9px;cursor:pointer}.empty{grid-column:1/-1;color:#777;padding:40px;text-align:center}footer{text-align:center;padding:35px;color:#999;font-size:12px}@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}.catalog{grid-template-columns:170px 1fr}.steps{grid-template-columns:1fr}}@media(max-width:600px){header{padding:15px}nav{gap:12px}.hero{padding:22px}.hero h1{font-size:19px}.hero .stamp{width:85px;height:65px;font-size:14px}.catalog{grid-template-columns:1fr}.filters{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.filters h3{grid-column:1/-1}.products{gap:9px}.photo{height:140px}.top{flex-wrap:wrap}.search{max-width:none}}</style></head><body><header><div><div class="brand">YUN KBO</div><div class="sub">KOREAN SPORTS COLLECTION</div></div><nav><a href="#catalog">商品</a><a href="admin.html">後台預覽</a><button class="cart" onclick="showList()">詢問清單 <span id="count">0</span></button></nav></header><main class="shell"><section class="hero"><h1>從球場到日常，<br>收藏你喜歡的韓國運動周邊。</h1><div class="stamp">YUN KBO</div></section><section class="steps"><div class="step"><strong>01　瀏覽豐富商品</strong><p>依球隊、商品分類或中/韓文關鍵字，<br>找到喜歡的韓國運動周邊商品。</p></div><div class="step"><strong>02　加入詢問清單</strong><p>將想詢問的商品加入清單，<br>調整數量，並留下尺寸或顏色需求。</p></div><div class="step"><strong>03　透過 LINE 詢問</strong><p>將清單內容分享至 LINE，<br>向 YUN KBO 確認價格、庫存與訂購方式。</p></div></section><div class="notice">展示用預覽版：商品、價格皆為示意資料，尚未連接資料庫或 LINE 商家帳號。</div><section class="catalog" id="catalog"><aside class="filters"><h3>運動類別</h3><select id="sport" onchange="render()"><option value="">全部運動</option><option>棒球</option><option>籃球</option><option>排球</option><option>足球</option><option>羽球</option><option>其他</option></select><h3>球隊</h3><select id="team" onchange="render()"><option value="">全部球隊</option></select><h3>商品分類</h3><select id="category" onchange="render()"><option value="">全部分類</option></select></aside><section class="content"><div class="top"><h2>商品</h2><input class="search" id="search" placeholder="搜尋商品名稱或關鍵字" oninput="render()"></div><div class="products" id="products"></div><div class="hint" id="total"></div></section></section></main><footer>YUN KBO · 網站介面預覽版</footer><script>const cats=['球衣','帽子','服飾','包包','運動用品','應援用品','娃娃/吊飾/飾品','生活用品','吉祥物商品','其他','聯名商品','紀念商品'];const items=[['棒球','斗山熊','球衣','主場球衣',2390],['棒球','LG 雙子','帽子','球隊刺繡棒球帽',1090],['棒球','韓華鷹','應援用品','球隊應援毛巾',590],['棒球','樂天巨人','娃娃/吊飾/飾品','吉祥物吊飾',420],['籃球','首爾 SK 騎士','服飾','球隊短袖 T 恤',890],['排球','現代建設','應援用品','球隊應援手幅',450],['足球','FC 首爾','球衣','主場球衣',2190],['棒球','三星獅','生活用品','球隊隨行杯',690],['棒球','起亞虎','帽子','球隊休閒帽',980],['羽球','韓國代表隊','運動用品','運動毛巾',390],['棒球','KT 巫師','聯名商品','聯名紀念上衣',1290],['棒球','SSG 登陸者','紀念商品','紀念徽章組',490]].map((a,i)=>({id:'DEMO-'+String(i+1).padStart(3,'0'),sport:a[0],team:a[1],cat:a[2],name:a[1]+' '+a[3],price:a[4]}));const cart=[];const $=id=>document.getElementById(id);cats.forEach(c=>$('category').add(new Option(c,c)));function shirt(){return '<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M32 17L17 25 7 45l19 8 7-13v42h34V40l7 13 19-8-10-20-15-8-9 12H41l-9-12Z" fill="#fff" stroke="#b8bdcb" stroke-width="3"/><path d="M41 18v20m18-20v20" stroke="#d0d4de" stroke-width="3"/><path d="M34 49h32" stroke="#DD6C32" stroke-width="4"/></svg>'}function render(){const sport=$('sport').value,old=$('team').value;const teams=[...new Set(items.filter(p=>!sport||p.sport===sport).map(p=>p.team))];$('team').innerHTML='<option value="">全部球隊</option>'+teams.map(t=>'<option>'+t+'</option>').join('');$('team').value=teams.includes(old)?old:'';const team=$('team').value,cat=$('category').value,q=$('search').value.trim().toLowerCase();const found=items.filter(p=>(!sport||p.sport===sport)&&(!team||p.team===team)&&(!cat||p.cat===cat)&&(!q||p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)));$('products').innerHTML=found.length?found.map(p=>`<article class="product"><div class="photo">${shirt()}${p.id==='DEMO-001'?'<span class="tag">NEW</span>':''}</div><div class="info"><h3>${p.name}</h3><div class="price">NT$ ${p.price.toLocaleString()}</div><button class="add" onclick="add('${p.id}')">＋ 加入詢問清單</button></div></article>`).join(''):'<div class="empty">沒有符合條件的商品</div>';$('total').textContent='共 '+found.length+' 件示意商品';}function add(id){cart.push(items.find(p=>p.id===id));$('count').textContent=cart.length;alert('已加入詢問清單（僅限本次預覽）')}function showList(){alert(cart.length?'目前清單：\n'+cart.map(p=>p.id+' '+p.name).join('\n')+'\n\n正式版會支援規格、數量與 LINE 分享。':'詢問清單目前是空的。')}render();</script></body></html>
